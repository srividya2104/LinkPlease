services:
  - type: web
    name: linkplease-service
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false
      - key: PSEUDOGRAM_BASE_URL
        value: https://pseudogram-api.onrender.com
      - key: VERIFY_WEBHOOK_SIGNATURE
        value: "true"
      - key: DATABASE_PATH
        value: linkplease.db
      - key: MAX_SEND_PER_MINUTE
        value: "9"
